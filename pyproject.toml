[build-system]
# torch is deliberately NOT listed here: the extension must compile against the
# torch already installed in the target environment (install with
# --no-build-isolation). Listing it would let pip build _C against a freshly
# resolved torch in an isolated env — ABI-mismatched with the venv's torch —
# which fails only at runtime ("tensor does not have a device").
requires = [
    "setuptools>=64",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "flex_gemm"
version = "1.0.0"
description = "A Cross-Platform Backend for High-Performance Sparse Convolutions"
requires-python = ">=3.8"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jianfeng Xiang", email = "belljig@outlook.com" }
]
dependencies = [
    # On macOS, mtlgemm's metal_context.mm calls
    # at::mps::dispatch_sync_with_rethrow which was added to that namespace
    # in PyTorch 2.11.0 (pytorch/pytorch#167445, merged 2025-11-11). Earlier
    # stable versions (2.6 – 2.10) only expose it via at::native::mps::.
    "torch>=2.11.0; platform_system == 'Darwin'",
    "torch>=2.4.0; platform_system != 'Darwin'",
    "triton>=3.2.0; platform_system == 'Linux'",
    "triton-windows>=3.2.0; platform_system == 'Windows'",
    "filelock",
]
